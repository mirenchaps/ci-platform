name: Python validation

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to run checks
        required: false
        default: "3.12"
        type: string
      run-coverage:
        description: Generate a coverage XML report
        required: false
        default: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        description: SonarQube Cloud token; the scan is skipped when unset
        required: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        # Run the scanner directly: the action needs API access that callers cannot grant.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --no-banner

  validate:
    name: Python validation
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Sonar needs full history to attribute new code correctly.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check . --output-format=github

      - name: Run tests with coverage
        if: inputs.run-coverage
        run: pytest tests/ -v --cov --cov-report=xml

      - name: Run tests
        if: ${{ !inputs.run-coverage }}
        run: pytest tests/ -v

      - name: Audit dependencies
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1