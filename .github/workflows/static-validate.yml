name: Static validation

# For repositories without a build or test suite: scripts, configuration and documentation.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        # Run the scanner directly: the action needs API access that callers cannot grant.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --no-banner

  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate JSON syntax
        run: |
          found=0
          while IFS= read -r file; do
            found=1
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$file" \
              || { echo "Invalid JSON: $file"; exit 1; }
          done < <(find . -path ./.git -prune -o -name '*.json' -type f -print)
          [ "$found" -eq 0 ] && echo "No JSON files"
          exit 0

      - name: Lint Python
        continue-on-error: true
        run: |
          if find . -path ./.git -prune -o -name '*.py' -type f -print -quit | grep -q .; then
            pipx install ruff >/dev/null
            ruff check . --output-format=github
          else
            echo "No Python files"
          fi

      - name: Analyse PowerShell
        continue-on-error: true
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Recurse -Filter *.ps1 -ErrorAction SilentlyContinue
          if (-not $scripts) { Write-Output "No PowerShell files"; exit 0 }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $results = $scripts | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error }
          if ($results) { $results | Format-Table -AutoSize; exit 1 }
          Write-Output "No errors found"

      - name: Check shell scripts
        continue-on-error: true
        run: |
          mapfile -t scripts < <(find . -path ./.git -prune -o -name '*.sh' -type f -print)
          if [ "${#scripts[@]}" -eq 0 ]; then echo "No shell scripts"; exit 0; fi
          shellcheck --severity=error "${scripts[@]}"

      - name: Lint YAML
        continue-on-error: true
        run: |
          if find . -path ./.git -prune -o \( -name '*.yml' -o -name '*.yaml' \) -type f -print -quit | grep -q .; then
            pipx install yamllint >/dev/null
            yamllint --no-warnings -d relaxed .
          else
            echo "No YAML files"
          fi
