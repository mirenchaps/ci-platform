name: Node validation

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version used to run checks
        required: false
        default: "22"
        type: string
      working-directory:
        description: Directory holding package.json, relative to the repo root
        required: false
        default: "."
        type: string
      lint-paths:
        description: Paths passed to eslint
        required: false
        default: "src tests"
        type: string

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        # Run the scanner directly: the action needs API access that callers cannot grant.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --no-banner

  validate:
    name: Node validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # NOT SHA-pinned: no setup-node SHA existed anywhere in these repos to
      # copy, and inventing one would pin to an unverified commit.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Lint
        run: ./node_modules/.bin/eslint ${{ inputs.lint-paths }} --quiet

      - name: Tests
        run: npm test -- --run
