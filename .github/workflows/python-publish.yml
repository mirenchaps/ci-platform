name: Python publish

on:
  workflow_call:
    inputs:
      image-name:
        description: Docker Hub image name without the registry namespace
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      JENKINS_URL:
        required: true
      JENKINS_USER:
        required: true
      JENKINS_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.sha.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image tag
        id: sha
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  trigger-jenkins:
    name: Trigger Jenkins deploy
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Trigger Jenkins pipeline
        run: |
          crumb=$(curl -fsSL "${{ secrets.JENKINS_URL }}/crumbIssuer/api/json" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            | python3 -c "import sys,json; data=json.load(sys.stdin); print(data['crumbRequestField']+':'+data['crumb'])")
          curl -fsSL -X POST "${{ secrets.JENKINS_URL }}/job/${{ inputs.image-name }}/buildWithParameters" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            -H "$crumb" \
            --data "IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}"