name: GitOps validation

on:
  workflow_call:
    inputs:
      helm-charts:
        description: Newline-delimited local Helm chart directories
        required: false
        default: ""
        type: string
      kustomize-roots:
        description: Newline-delimited Kustomize root directories
        required: false
        default: ""
        type: string
      prometheus-rule-paths:
        description: Newline-delimited Prometheus rule files
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        # Run the scanner directly: the action needs API access that callers cannot grant.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --no-banner

  validate:
    name: GitOps validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0

      - name: Lint and render Helm charts
        env:
          HELM_CHARTS: ${{ inputs.helm-charts }}
        run: |
          while IFS= read -r chart; do
            [ -z "$chart" ] && continue
            helm lint "$chart"
            helm template "$(basename "$chart")" "$chart" >/dev/null
          done <<< "$HELM_CHARTS"

      - name: Render Kustomize roots
        env:
          KUSTOMIZE_ROOTS: ${{ inputs.kustomize-roots }}
        run: |
          while IFS= read -r root; do
            [ -z "$root" ] && continue
            kustomize build --enable-helm "$root" >/dev/null
          done <<< "$KUSTOMIZE_ROOTS"

      - name: Check Prometheus rules
        env:
          PROMETHEUS_RULE_PATHS: ${{ inputs.prometheus-rule-paths }}
        run: |
          if [ -z "$PROMETHEUS_RULE_PATHS" ]; then
            echo "No Prometheus rule paths supplied"
            exit 0
          fi
          python3 -m pip install --quiet pyyaml
          mkdir -p /tmp/promrules
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if [ -d "$path" ]; then
              mapfile -t files < <(find "$path" -type f \( -name '*.yaml' -o -name '*.yml' \))
            else
              files=("$path")
            fi
            for file in "${files[@]}"; do
              # Rules ship as PrometheusRule CRDs, so promtool needs spec.groups lifted out.
              python3 -c '
          import sys, yaml
          document = yaml.safe_load(open(sys.argv[1])) or {}
          groups = document.get("spec", document).get("groups", [])
          yaml.safe_dump({"groups": groups}, open(sys.argv[2], "w"))
          ' "$file" "/tmp/promrules/$(echo "$file" | tr '/' '_')"
            done
          done <<< "$PROMETHEUS_RULE_PATHS"
          for rule in /tmp/promrules/*; do
            echo "Checking $rule"
            docker run --rm --entrypoint promtool -v /tmp/promrules:/rules \
              prom/prometheus:v3.5.0 check rules "/rules/$(basename "$rule")"
          done

      - name: Scan configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"