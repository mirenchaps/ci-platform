# ci-platform/.github/workflows/python-ci.yml
#
# Reusable GitHub Actions workflow for Python projects.
#
# Any repo can call this workflow from its own ci.yml with:
#
#   jobs:
#     ci:
#       uses: mirenchaps/ci-platform/.github/workflows/python-ci.yml@main
#       with:
#         image-name: your-image-name
#       secrets:
#         DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
#         DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
#
# Stages: lint → test → docker build → docker push
#
# Docs: https://docs.github.com/en/actions/sharing-automations/reusing-workflows

on:
  workflow_call:
    inputs:
      image-name:
        description: "Docker Hub image name, e.g. mirenchaps/home-network-mcp"
        required: true
        type: string
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.12"
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Lint
  # ruff is a fast Python linter written in Rust — checks style and common errors.
  # Docs: https://docs.astral.sh/ruff/
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        # --output-format=github annotates the PR diff with lint errors inline
        run: ruff check . --output-format=github

  # ---------------------------------------------------------------------------
  # Stage 2: Test
  # pytest with asyncio mode enabled (needed for async tool functions).
  # Docs: https://docs.pytest.org  /  https://pytest-asyncio.readthedocs.io
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        # Install both runtime and dev requirements
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v

  # ---------------------------------------------------------------------------
  # Stage 3: Build and push Docker image
  # Only runs on pushes to main, not on pull requests.
  # The image is tagged with both the git SHA (immutable) and 'latest'.
  # Docs: https://docs.docker.com/build/ci/github-actions/
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      # Pass the SHA tag downstream so Jenkins knows exactly which image to deploy
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}
          # tag with the short git SHA so every build is traceable
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
